# Docker Compose file for running only the database during development.
#
# Usage:
#   docker compose -f docker-compose.db-dev.yaml up        # Ctrl+C to stop
#   docker compose -f docker-compose.db-dev.yaml up -d     # detached mode
#   docker compose -f docker-compose.db-dev.yaml down      # stop (detached)
#
# Data is stored in ./data/bioheating-db (persistent across restarts).
#
# Note: The data/bioheating-db folder is owned by Docker (root), so you
# may need sudo to delete it:
#   sudo rm -rf docker/data/bioheating-db

services:
  bioheating-db:
    image: bioheating-db:latest
    container_name: bioheating-db
    volumes:
      - ./data/bioheating-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bioheating
      POSTGRES_DB: bioheating
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
