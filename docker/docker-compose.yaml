# Docker Compose file for running the complete BioHeating application.
#
# Usage:
#   docker compose up        # Ctrl+C to stop
#   docker compose up -d     # detached mode
#   docker compose down      # stop (detached)
#
# Database data is stored in ./data/bioheating-db (persistent across restarts).
# Application uploads are stored in ./data/uploads.
#
# Note: The data/ folders may be owned by Docker (root), so you
# may need sudo to delete them if needed:
#   sudo rm -rf ./data/bioheating-db
#   sudo rm -rf ./data/uploads

services:
  bioheating-db:
    image: bioheating-db:latest
    container_name: bioheating-db
    volumes:
      - ./data/bioheating-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bioheating
      POSTGRES_DB: bioheating
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    network_mode: host

  bioheating-app:
    image: bioheating-app:latest
    container_name: bioheating-app
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      bioheating-db:
        condition: service_healthy
    network_mode: host
