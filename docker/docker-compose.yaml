# Docker Compose file for running the complete BioHeating application.
#
# Usage:
#   docker compose up        # Ctrl+C to stop
#   docker compose up -d     # detached mode
#   docker compose down      # stop (detached)
#
# Data folders (persistent across restarts):
#
#   data/
#     db/          # the database files
#     app/         # the application data directory (APP_DATA_DIR)
#       model/     # the prediction model: *.ubj files and config.json
#       uploads/   # temporary files of uploads and exports
#
# The application does not start when the prediction model is missing in
# data/app/model (see docker/README.md).
#
# Note: The data/ folders may be owned by Docker (root), so you
# may need sudo to delete them if needed:
#   sudo rm -rf ./data/db
#   sudo rm -rf ./data/app/uploads
#
# Also note, that the memory settings (mem_limit, Xmx) are for a small server
# currently. It makes sense to adjust them when moving to a more powerfull
# server.

services:
  bioheating-db:
    image: bioheating-db:latest
    container_name: bioheating-db
    volumes:
      - ./data/db:/var/lib/postgresql/data
    mem_limit: 768m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bioheating
      POSTGRES_DB: bioheating
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    network_mode: host

  bioheating-app:
    image: bioheating-app:latest
    container_name: bioheating-app
    volumes:
      - ./data/app:/app/data
    mem_limit: 2560m
    restart: unless-stopped
    environment:
      APP_DATA_DIR: /app/data
      # the maximum number of parallel tasks (imports, calculations) and the
      # threads per calculation (0 = automatic), see application.properties
      BIOHEATING_TASKS_MAX_PARALLEL: 2
      BIOHEATING_CALCULATION_THREADS: 0
      JAVA_TOOL_OPTIONS: "-Xmx2176m -XX:MaxMetaspaceSize=384m -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -XX:+UseStringDeduplication"
    depends_on:
      bioheating-db:
        condition: service_healthy
    network_mode: host
