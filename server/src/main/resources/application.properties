spring.application.name=bio-heating-tool
server.port=3000
db.host=localhost
db.port=5432
db.name=bioheating
db.user=postgres
db.password=bioheating
# the data directory with the prediction model (model/) and temporary files
# (uploads/); can be set via the environment variable APP_DATA_DIR
app.data-dir=${APP_DATA_DIR:./app}

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.enabled=true

# Background tasks: project imports, data updates, and calculations. Each
# property can also be set via an environment variable, e.g.
# APP_TASKS_MAX_PARALLEL=4
#
# the maximum number of tasks that run in parallel; further tasks wait in the
# queue
app.tasks.max-parallel=2
# the maximum number of waiting tasks; when the queue is full, new tasks are
# rejected
app.tasks.queue-capacity=100
# how long the results of finished tasks are kept, in minutes
app.tasks.retention-minutes=30
# the number of threads of a single network calculation; 0 means automatic:
# about the half of the available processors
app.calculation.threads=0

