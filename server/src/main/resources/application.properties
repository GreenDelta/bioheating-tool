spring.application.name=bio-heating-tool
server.port=3000
db.host=localhost
db.port=5432
db.name=bioheating
db.user=postgres
db.password=bioheating
# the data directory with the prediction model (model/) and temporary files
# (uploads/); can be set via the environment variable APP_DATA_DIR
app.data-dir=${APP_DATA_DIR:./app}

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.enabled=true

# Task execution configuration
bioheating.tasks.pool-size=4
bioheating.tasks.max-pool-size=8
bioheating.tasks.queue-capacity=100
bioheating.tasks.timeout=30

